<!doctype html>
<!--
  Source of truth for the ECL AI.app icon: the Emerging Cities Lawyers "ECL"
  monogram (same paths as the firm's favicon and packages/ui MikeIconUI.tsx)
  in ECL paper on an ECL maroon plate, with "AI" in ECL gold beneath a thin
  gold rule. macOS Big-Sur icon grid: 824x824 plate centred, r = 185.
  Rendered to 1024x1024 PNG by scripts/render-icon.js, then iconutil -> icns.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        background: transparent;
        overflow: hidden;
      }
      svg {
        display: block;
      }
    </style>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
      <defs>
        <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6a2532" />
          <stop offset="1" stop-color="#3f1521" />
        </linearGradient>
        <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.10" />
          <stop offset="0.45" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
          <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.28" />
        </filter>
      </defs>

      <g filter="url(#shadow)">
        <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)" />
      </g>
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)" />
      <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#c9a24e" stroke-opacity="0.35" stroke-width="2" />

      <!-- ECL monogram: 64-unit grid, letters span x 5..58, y 19..45. Scaled x10, centred. -->
      <g transform="translate(512 430) scale(10) translate(-31.5 -32)" fill="#f8f2e7">
        <path d="M5,19 H21 V24 H10 V29.6 H19.5 V34.6 H10 V40 H21 V45 H5 Z" />
        <path d="M40.28,24.31 A9.5,13.4 0 1 0 40.28,39.69 L36.60,37.11 A5,8.9 0 1 1 36.60,26.90 Z" />
        <path d="M44,19 H49 V40 H58 V45 H44 Z" />
      </g>

      <!-- Gold rule and "AI" -->
      <rect x="402" y="640" width="220" height="5" fill="#c9a24e" />
      <g transform="translate(525.5 688)" fill="#c9a24e" fill-rule="evenodd">
        <!-- A: 56 wide, 72 tall -->
        <path d="M-58,72 L-38,0 H-22 L-2,72 H-17 L-21,56 H-39 L-43,72 Z M-36,43 H-24 L-30,19 Z" />
        <!-- I -->
        <rect x="16" y="0" width="15" height="72" />
      </g>
    </svg>
  </body>
</html>
